
name: Vib Build

on:
  push:
    branches:
      - 'dev'
    tags:
      - '*'
  pull_request:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
        image_name:
          - gnome-china
          - gnome-nvidia-china
          - gnome-nvidia-modern-china
          - gnome-vm-china
        include:
          - runner: ubuntu-26.04
            arch: amd64
          - runner: ubuntu-26.04-arm
            arch: arm64
          - base_image: ghcr.io/vanilla-os/gnome
            image_name: gnome-china
          - base_image: ghcr.io/vanilla-os/gnome-nvidia
            image_name: gnome-nvidia-china
          - base_image: ghcr.io/vanilla-os/gnome-nvidia-modern
            image_name: gnome-nvidia-modern-china
          - base_image: ghcr.io/vanilla-os/gnome-vm
            image_name: gnome-vm-china
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: fangcatchina/build-gh-action@b915d0b6e0a8bcb1b7152dbf3d545645df8a2f38
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}
          base-image: ghcr.io/vanilla-os/gnome
          base-replacement: ${{ matrix.base_image }}

  merge:
    name: Merge
    needs: build
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        image_name:
          - gnome-china
          - gnome-nvidia-china
          - gnome-nvidia-modern-china
          - gnome-vm-china
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: fangcatchina/merge-gh-action@4809840231f5f1d9ccdb07c35466b683a60155eb
        with:
          image: ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}
